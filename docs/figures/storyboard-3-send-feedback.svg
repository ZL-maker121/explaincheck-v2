<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="695" version="1.1" viewBox="0 0 1800 695" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9F8" height="695" width="1800" x="0" y="0" /><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="46" font-weight="bold" x="75" y="78">Story 3  |  Feedback depends on viewing</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="77" y="120">The system distinguishes an explanation rating from no exposure</text><rect fill="#FFFFFF" height="446" rx="22" ry="22" stroke="#D7E4E2" stroke-width="2" width="484" x="65" y="155" /><circle cx="107" cy="203" fill="#138077" r="23" /><text fill="white" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="bold" x="99" y="213">1</text><text fill="#138077" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold" x="145" y="209">Decide</text><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="bold" x="90" y="268">Choose before reading</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="90" y="330">EC-01: user selects Billing.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="90" y="371">Explanation was not opened.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="90" y="412">The reference is revealed.</text><line stroke="#D7E4E2" stroke-width="2" x1="88" x2="526" y1="535" y2="535" /><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="normal" x="90" y="571">Viewing flag = No.</text><rect fill="#FFFFFF" height="446" rx="22" ry="22" stroke="#D7E4E2" stroke-width="2" width="484" x="660" y="155" /><circle cx="702" cy="203" fill="#138077" r="23" /><text fill="white" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="bold" x="694" y="213">2</text><text fill="#138077" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold" x="740" y="209">Reflect</text><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="bold" x="685" y="268">Avoid invalid rating</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="685" y="330">No usefulness scale is shown.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="685" y="371">System records Not viewed.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="685" y="412">Optional comment is allowed.</text><line stroke="#D7E4E2" stroke-width="2" x1="683" x2="1121" y1="535" y2="535" /><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="normal" x="685" y="571">Cannot rate an unseen explanation.</text><rect fill="#FFFFFF" height="446" rx="22" ry="22" stroke="#D7E4E2" stroke-width="2" width="484" x="1255" y="155" /><circle cx="1297" cy="203" fill="#138077" r="23" /><text fill="white" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="bold" x="1289" y="213">3</text><text fill="#138077" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold" x="1335" y="209">Review</text><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="bold" x="1280" y="268">Check the local record</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="1280" y="330">Session lists both cases.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="1280" y="371">Shows whether cues were viewed.</text><text fill="#5A737B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="normal" x="1280" y="412">CSV includes viewing flag.</text><line stroke="#D7E4E2" stroke-width="2" x1="1278" x2="1716" y1="535" y2="535" /><text fill="#15353E" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="normal" x="1280" y="571">Feedback does not change rules.</text><line stroke="#138077" stroke-width="6" x1="559" x2="642" y1="379" y2="379" /><polygon fill="#138077" points="642.0,379.0 624.0,388.0 624.0,370.0" /><line stroke="#138077" stroke-width="6" x1="1154" x2="1237" y1="379" y2="379" /><polygon fill="#138077" points="1237.0,379.0 1219.0,388.0 1219.0,370.0" /></svg>